version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nur_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nur_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./backend
    container_name: nur_ai_backend
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nur_ai
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ANYMODEL_API_KEY=${ANYMODEL_API_KEY}
      - ANYMODEL_BASE_URL=${ANYMODEL_BASE_URL}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    restart: always

volumes:
  pgdata:
    driver: local
